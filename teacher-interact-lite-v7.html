<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>教师交互出题工作台</title>
  <script src="/marked.min.js"></script>
  <style>
    :root {
      /* Refined Warm — claude-anchored open-design (terracotta on warm neutrals).
         Cool blue-gray/indigo swapped for warm cream/sand + terracotta accent. */
      --bg: #faf8f3;
      --surface: #fffefb;
      --surface-soft: #f3f0e9;
      --fg: #1a1916;
      --muted: #5e5d59;
      --border: #ebe7dc;
      --primary: #c96442;
      --primary-soft: #fbeee5;
      --primary-strong: #b85234;
      --success: #1f7a3a;
      --success-soft: #e8f3ec;
      --warning: #a85e00;
      --warning-soft: #fbefdd;
      --danger: #b53333;
      --danger-soft: #f7e6e4;
      --running: #2f5dc4;
      --running-soft: #e9eef9;
      --shadow: 0 6px 24px rgba(58, 47, 30, 0.07), 0 2px 6px rgba(58, 47, 30, 0.04);
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Noto Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    button,
    textarea { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 64px 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .task-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 260px;
    }

    .task-title strong {
      font-size: 15px;
      font-weight: 600;
    }

    .task-subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .stage-pills {
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
    }

    .stage-pill {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      font-weight: 650;
    }

    .stage-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--border);
    }

    .stage-pill.active {
      color: var(--primary);
      border-color: #f4dccd;
      background: var(--primary-soft);
    }

    .stage-pill.active::before { background: var(--primary); }

    .stage-pill.done {
      color: var(--success);
      border-color: #c3e6cd;
      background: var(--success-soft);
    }

    .stage-pill.done::before { background: var(--success); }

    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: 240px minmax(420px, 1fr) 430px;
    }

    .sidebar,
    .chat,
    .workspace {
      min-height: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .workspace {
      border-right: 0;
      background: var(--surface);
    }

    .pane-header {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .pane-header h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .pane-caption {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .new-task {
      padding: 9px 12px;
      width: 100%;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    .sidebar-body {
      padding: 14px;
      overflow: auto;
      height: calc(100vh - 64px - 56px);
    }

    .session-card {
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      transition: border-color 120ms ease, background 120ms ease;
    }

    .session-card.active {
      background: var(--primary-soft);
      border-color: #f4dccd;
    }

    .session-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .session-card span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .status-tag {
      display: inline-flex;
      margin-top: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--surface-soft);
      color: var(--muted);
    }

    .status-tag.reviewing {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-tag.generating {
      background: var(--running-soft);
      color: var(--running);
    }

    .status-tag.completed {
      background: var(--success-soft);
      color: var(--success);
    }

    .chat {
      display: grid;
      grid-template-rows: 56px 1fr auto;
    }

    .message-stream {
      min-height: 0;
      overflow: auto;
      padding: 20px;
      background: var(--bg);
    }

    .empty-guide {
      max-width: 760px;
      margin: 44px auto 0;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .empty-guide h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .empty-guide p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .support-modes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid #f4dccd;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    .mode-desc {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .message {
      max-width: 760px;
      margin-bottom: 14px;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      line-height: 1.65;
      font-size: 14px;
      box-shadow: 0 1px 0 rgba(58, 47, 30, 0.04);
    }

    .message.teacher {
      margin-left: auto;
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .message-label {
      margin-bottom: 4px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .message.teacher .message-label {
      color: rgba(255, 255, 255, 0.75);
    }

    .message p { margin: 0; }

    .hint-box {
      margin-top: 10px;
      padding: 9px 11px;
      border-left: 3px solid var(--primary);
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 13px;
    }

    .composer {
      padding: 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    textarea {
      min-height: 56px;
      max-height: 150px;
      resize: vertical;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      line-height: 1.55;
      color: var(--fg);
      background: var(--surface);
    }

    textarea:focus {
      border-color: #c96442;
      box-shadow: 0 0 0 3px rgba(201, 100, 66, 0.18);
    }

    .send-btn,
    .primary-btn,
    .secondary-btn,
    .danger-btn {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 9px;
      font-weight: 600;
    }

    .send-btn,
    .primary-btn {
      background: var(--primary);
      color: #fff;
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
    }

    .danger-btn {
      background: var(--danger-soft);
      color: var(--danger);
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .workspace {
      display: grid;
      grid-template-rows: 56px 1fr auto;
    }

    .workspace-body {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .workspace-footer {
      padding: 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .empty-panel {
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 20px;
    }

    .empty-panel .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.55;
    }

    .draft-info {
      padding: 11px 12px;
      margin-bottom: 12px;
      border: 1px solid #f4dccd;
      border-radius: var(--radius);
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 13px;
      line-height: 1.55;
    }

    .intent-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .intent-bar strong {
      color: var(--primary);
    }

    .slot-card {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }

    .slot-head {
      padding: 12px 13px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-soft);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
    }

    .slot-head strong {
      font-size: 13px;
    }

    .slot-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .slot-body {
      padding: 12px;
    }

    .slot-subsection {
      padding: 10px 0 12px;
      border-bottom: 1px dashed var(--border);
    }

    .slot-subsection:first-child {
      padding-top: 0;
    }

    .slot-subsection:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .subsection-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .slot-head .phase-badge {
      color: var(--primary);
      font-size: 11px;
    }

    .slot-guidance {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .option-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 10px 10px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .option-card:hover {
      border-color: #f4dccd;
      transform: translateY(-1px);
    }

    .option-card.selected {
      background: var(--success-soft);
      border-color: #8fcfa1;
    }

    .option-title {
      font-size: 13px;
      line-height: 1.45;
    }

    .option-desc {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .select-btn {
      min-width: 66px;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
    }

    .option-card.selected .select-btn {
      color: #fff;
      background: var(--success);
      border-color: var(--success);
    }

    .comment-input {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      font-size: 13px;
    }

    .progress-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress-line strong { color: var(--fg); }

    .generating-panel {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 14px;
      border: 4px solid var(--running-soft);
      border-top-color: var(--running);
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* === 动效系统（Refined Warm motion）=== */
    @keyframes enter-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes enter-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes blink-cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 0 0 rgba(201,100,66,0.32); } 50% { box-shadow: 0 0 0 5px rgba(201,100,66,0); } }
    @keyframes bar-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* 入场：消息/卡片淡入上移（one-shot，fill both）*/
    .message { animation: enter-up 280ms ease-out both; }
    .slot-card { animation: enter-up 320ms ease-out both; }
    .result-card { animation: enter-up 260ms ease-out both; }
    .mode-card { animation: enter-up 280ms ease-out both; transition: transform 200ms ease-out, border-color 200ms ease-out, background 200ms ease-out; }
    .mode-card:hover { transform: translateY(-2px); border-color: var(--primary); background: var(--surface); box-shadow: 0 4px 14px rgba(58,47,30,0.06); }
    .mode-card:active { transform: translateY(0) scale(0.99); }

    /* 生成中圆点：脉冲呼吸 */
    .gdot.active { animation: pulse-dot 1.4s ease-out infinite; }

    /* 进度条流光叠加（给 .bar 加 .shine 即流光）*/
    .shine { position: relative; overflow: hidden; }
    .shine::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }

    /* 流式光标（打字机/流式时附在文末）*/
    .stream-cursor { display: inline-block; width: 7px; height: 1.05em; vertical-align: text-bottom; background: var(--primary); margin-left: 1px; border-radius: 1px; animation: blink-cursor 1.1s steps(1) infinite; }

    .result-card {
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .result-card.completed {
      border-color: #c3e6cd;
      background: var(--success-soft);
    }

    .result-card.generating {
      border-color: #cfe1f3;
      background: var(--running-soft);
    }

    .result-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .result-card span {
      color: var(--muted);
      font-size: 12px;
    }

    .result-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .mini-btn {
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      font-size: 12px;
      font-weight: 700;
    }

    .question-detail {
      max-width: 820px;
      margin: 0 auto;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      line-height: 1.7;
    }

    .question-detail h3 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .question-detail h4 {
      margin: 18px 0 8px;
      font-size: 14px;
    }

    .question-detail ol {
      margin: 8px 0 0 22px;
      padding: 0;
    }

    .markdown-preview, .question-detail .md-body {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      line-height: 1.75;
      font-size: 14px;
    }
    .markdown-preview pre, .question-detail .md-body pre {
      background: var(--surface-soft);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
    }
    .markdown-preview code, .question-detail .md-body code {
      font-family: var(--mono);
      font-size: 0.9em;
    }
    .markdown-preview table, .question-detail .md-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
    }
    .markdown-preview th, .markdown-preview td,
    .question-detail .md-body th, .question-detail .md-body td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    .markdown-preview th, .question-detail .md-body th {
      background: var(--surface-soft);
      font-weight: 600;
    }
    .markdown-preview strong, .question-detail .md-body strong {
      font-weight: 700;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .revision-note {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed #f4dccd;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 13px;
      line-height: 1.7;
    }


    .revision-textarea {
      width: 100%;
      min-height: 82px;
      margin-top: 10px;
      font-size: 13px;
    }

    .revision-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }



    .mode-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .mode-card {
      padding: 12px;
      border: 1px solid #f4dccd;
      border-radius: 12px;
      background: var(--primary-soft);
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
    }
    .mode-card:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
      box-shadow: 0 1px 0 rgba(58, 47, 30, 0.04);
    }

    /* 每题进度卡（Entry 生成剧场）*/
    .gen-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .gen-card { padding: 14px; border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 0 rgba(58, 47, 30, 0.04); transition: border-color 220ms ease, box-shadow 220ms ease; }
    .gen-card[data-status="completed"] { border-left-color: var(--success); }
    .gen-card[data-status="generating"] { border-left-color: var(--primary); }
    .gen-card[data-status="failed"] { border-left-color: var(--danger); }
    .gen-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .gen-card-head strong { font-size: 14px; font-weight: 600; }
    .gen-steps { display: flex; align-items: center; margin-bottom: 8px; }
    .gdot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); flex-shrink: 0; transition: background 220ms ease, border-color 220ms ease, box-shadow 220ms ease; }
    .gdot.done { background: var(--success); border-color: var(--success); }
    .gdot.active { background: var(--primary-soft); border-color: var(--primary); box-shadow: 0 0 0 3px rgba(201, 100, 66, 0.14); }
    .gline { flex: 1; height: 2px; background: var(--border); margin: 0 4px; transition: background 220ms ease; }
    .gline.done { background: var(--success); }
    .gen-stage-label { font-size: 12px; color: var(--muted); margin-bottom: 10px; min-height: 16px; }
    .gen-bar { height: 4px; border-radius: 999px; background: var(--surface-soft); overflow: hidden; }
    .gen-fill { height: 100%; background: var(--primary); transition: width 600ms ease; border-radius: inherit; }

    .mode-card strong {
      display: block;
      color: var(--primary);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .mode-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 760px) {
      .mode-cards {
        grid-template-columns: 1fr;
      }
    }

    .version-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

        const timeoutMs = options.timeoutMs || 180000;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        const { timeoutMs: _timeoutMs, ...fetchOptions } = options;
        let response;
        try {
          response = await fetch(`${API_BASE}${path}`, {
            headers: {
              "Content-Type": "application/json",
              ...(fetchOptions.headers || {})
            },
            ...fetchOptions,
            signal: controller.signal
          });
        } catch (error) {
          if (error && error.name === "AbortError") {
            throw new Error(`请求超时：${API_BASE || location.origin}${path}`);
          }
          throw error;
        } finally {
          clearTimeout(timer);
        }
        if (!response.ok) {
          let detail = response.statusText;
          try {
            const body = await response.json();
            detail = body.detail || detail;
          } catch (_) {}
          throw new Error(detail);
        }
        if (options.raw) return response;
        return response.json();

        el.classList.remove("active", "done");

      tag.className = "status-tag";
      if (stage === "reviewing") tag.classList.add("reviewing");
      if (stage === "generating") tag.classList.add("generating");
