      stream.appendChild(article);
      stream.scrollTop = stream.scrollHeight;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function inferScenario(message) {
      const text = message.trim();

      if (!text || text.length < 4) return null;

      if (/数据结构期末|期末卷|自由考研模拟题组卷|先规划|自由出题/.test(text)) return scenarios.C1;
      if (/AVL|旋转|Cache映射题|一道|单题|选择题/.test(text) && !/套|考研模拟题组卷|模拟卷|期末卷/.test(text)) return scenarios.B;
      if (/408|模拟卷|考研模拟题组卷|Q\d+|Q12|组成原理/.test(text)) return scenarios.A;

      return null;
    }

    async function ensureSession() {
      if (state.sessionId) return state.sessionId;
      // Try restore from localStorage
      const savedId = localStorage.getItem(sessionStorageKey());
      if (savedId) {
        try {
          // Verify session still exists on server
          const result = await api.getDisplayResult(savedId);
          state.sessionId = savedId;
          return state.sessionId;
        } catch (_) {
          // Session expired or invalid, create new
          localStorage.removeItem(sessionStorageKey());
        }
      }
      const session = await api.createSession();
      state.sessionId = session.session_id;
      localStorage.setItem(sessionStorageKey(), state.sessionId);
      return state.sessionId;
    }

    function setSending(isSending) {
      const btn = document.getElementById("sendBtn");
      if (btn) {
        btn.disabled = isSending;
        btn.textContent = isSending ? "发送中" : "发送";
      }
    }

    // Enter to send, Shift+Enter for new line
    document.getElementById("teacherInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const input = document.getElementById("teacherInput");
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      await sendMessageText(message);
    }

    async function sendMessageText(message) {
      if (!message) return;

      document.getElementById("taskTitle").textContent = message.length > 24 ? message.slice(0, 24) + "..." : message;
      document.getElementById("currentSessionDesc").textContent = message.length > 30 ? message.slice(0, 30) + "..." : message;
      document.getElementById("taskSubtitle").textContent = "正在识别意图并生成草案";
      setStage("collecting");

      addMessage("teacher", message);

      renderGeneratingDraft();
      setSending(true);

      try {
        const sessionId = await ensureSession();
        const turn = await api.turn(sessionId, message);
        addMessage("agent", turn.response_text || "已收到需求。", turn.has_draft);

        if (turn.has_draft) {
          state.draft = normalizeDraft(await api.getDraft(sessionId));
          document.getElementById("taskSubtitle").textContent = getDraftHint(state.draft);
          renderDraft(state.draft, intentFromDraft(state.draft));
          setStage("reviewing");
          return;
        }

        if (turn.has_result) {
          setStage("generating");
          renderGeneratingQuestions();
          startPollingDisplayResult();
          return;
        }

        document.getElementById("taskSubtitle").textContent = "等待进一步需求";
        renderClarificationPanel();
      } catch (error) {
        addMessage("agent", `后端请求失败：${error.message || error}`);
        document.getElementById("workspaceCaption").textContent = "后端请求失败";
      } finally {
        setSending(false);
      }
    }

    function normalizeDraft(draft) {
      return {
        ...draft,
        sections: draft.sections.map(section => ({
          ...section,
          phase: section.phase || (/_type\b/i.test(section.slot_id || "") ? "question_type" : "combined"),
          annotation: section.annotation || "",
          selected_option_id: null,
          options: section.options.map(opt => ({
            ...opt,
            status: "unselected"
          }))
        }))
      };
    }

    function getDraftTitle(draft) {
      if (!draft) return "草案与结果";
      const phase = primaryDraftPhase(draft);
      if (phase === "knowledge") return "第一轮草案：选择考察范围";
      if (phase === "examination") return "第二轮草案：选择考察方式";
      if (draft.scenario === "A") return "组卷草案：选择每题考察方向";
      if (draft.scenario === "B") return "知识点出题草案：选择考察方向与题型";
      if (draft.scenario === "C") return "自由组卷草案：选择考察方向";
      return "草案待选择";
    }

    function getDraftHint(draft) {
      if (!draft) return "草案会在这里展示";
      const phase = primaryDraftPhase(draft);
      if (phase === "knowledge") return "先选择本轮要覆盖的粗知识点/章节，并确认每题题型；系统随后展开可选考察方式。";
      if (phase === "examination") return "已根据上一轮选择细化候选项，请选择具体考察方式后开始出题。";
      if (draft.scenario === "A") return "请为每个题位选择一个考察方向，确认后系统开始出题。";
      if (draft.scenario === "B") return "请在每张题卡内选择考察方向和题型，确认后系统开始出题。";
      if (draft.scenario === "C") return "请为每个题位选择考察方向，确认后系统开始出题。";
      return "请选择考察方向，确认后系统开始出题。";
    }

    function getSubmitButtonText(draft) {
      if (!draft) return "提交草案";
      if (hasDraftAnnotations(draft)) return "提交批注 · 调整草案";
      if (needsSecondRoundDraft(draft)) return "确认知识点 · 继续细化";
      if (primaryDraftPhase(draft) === "examination") return "确认考察方式 · 开始出题";
      /* Scenario A / B / C Round 2+: single round */
      return "确认选择 · 开始出题";
    }

    function renderClarificationPanel() {
      document.getElementById("workspaceTitle").textContent = "需要补充组卷结构";
      document.getElementById("workspaceCaption").textContent = "自由组卷会先确认题量和题型，再生成粗粒度草案";
      document.getElementById("workspaceFooter").style.display = "none";
      document.getElementById("workspaceBody").innerHTML = `
        <div class="empty-panel">
          <div>
            <div class="icon">?</div>
            <div style="font-weight:700;color:var(--fg);margin-bottom:8px">请在对话框补充题量和题型结构</div>
            <div style="line-height:1.7">例如：<br>“12题，5道选择、3道填空、2道简答、2道算法题，总分100，中等偏难”<br>系统随后会先生成粗粒度考察范围草案。</div>
          </div>
        </div>
      `;
    }

    function renderGeneratingDraft() {
      document.getElementById("workspaceTitle").textContent = "草案生成中";
      document.getElementById("workspaceCaption").textContent = "系统正在整理可选择草案";
      document.getElementById("workspaceFooter").style.display = "none";
      document.getElementById("workspaceBody").innerHTML = `
        <div class="generating-panel">
          <div>
            <div class="spinner"></div>
            <h3>正在生成草案</h3>
            <p style="color:var(--muted);font-size:14px;line-height:1.7">系统正在根据组卷结构规划题位。自由组卷会先展示粗粒度考察范围和题型选择，再进入具体考察方式细化。</p>
          </div>
        </div>
      `;
    }

    function renderDraft(draft, intentLabel = "") {
      document.getElementById("workspaceTitle").textContent = getDraftTitle(draft);
      document.getElementById("workspaceCaption").textContent = getDraftHint(draft);

      const body = document.getElementById("workspaceBody");

      // 检测是否有方案卡片（Entry D）
      const schemeSections = (draft.sections || []).filter(s => s.scheme_md);
      if (schemeSections.length > 0) {
        renderSchemeFlow(schemeSections);
        return;
      }

      // 旧格式：选项卡片（Entry A/B/C）
      body.innerHTML = `
        <div class="intent-bar">
          <span>系统识别意图：<strong>${escapeHtml(intentLabel || intentFromDraft(draft))}</strong></span>
          <span style="color:var(--muted)">如不正确，请在对话区说明修改。</span>
        </div>
        <div class="draft-info">${getDraftHint(draft)}</div>
        ${getDraftQuestionGroups(draft).map(group => renderQuestionGroup(group)).join("")}
      `;

      renderDraftFooter();
      updateDraftProgress();
    }

    // ── 方案卡片渲染（Entry D）──
    // ── 方案渲染（Entry D）：方案渲染到【对话区】，每题独立批注区 ──
    function addRichMessage(label, innerHtml) {
      const empty = document.getElementById("emptyGuide");
      if (empty) empty.remove();
      const stream = document.getElementById("messageStream");
      const article = document.createElement("article");
      article.className = "message agent scheme-msg";
      article.innerHTML = `
        <div class="message-label">助手 · 方案</div>
        <h3 style="margin:0 0 12px;font-size:16px;color:var(--fg);">${escapeHtml(label)}</h3>
        ${innerHtml}
      `;
      stream.appendChild(article);
      stream.scrollTop = stream.scrollHeight;
    }

    function renderSchemeQuestionBlock(q) {
      return `
        <div class="slot-card" style="margin-bottom:14px;">
          <div class="slot-head"><strong>第${q.num}题（${q.meta}）</strong></div>
          <div class="slot-body">
            <p style="margin:0 0 8px;font-size:14px;">${escapeHtml(q.knowledge)}</p>
            ${q.options.map((opt, i) => `
              <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;">
                <input type="checkbox" data-q="${q.num}" data-opt="${i}" style="width:18px;height:18px;cursor:pointer;">
                <span>${escapeHtml(opt)}</span>
              </label>
            `).join('')}
            <div style="margin-top:8px;">
              <textarea placeholder="教师批注：对本题的修改意见（每题独立批注区）"
                data-q-annotation="${q.num}"
                style="width:100%;min-height:48px;font-size:13px;padding:8px;border:1px solid var(--border);border-radius:6px;resize:vertical;"></textarea>
            </div>
          </div>
        </div>
      `;
    }

    function buildSchemeQuestionsHtml(scheme) {
      const lines = (scheme.scheme_md || "").split("\n");
      const htmlParts = [];
      let currentQuestion = null;
      for (const line of lines) {
        const trimmed = line.trim();
        const qMatch = trimmed.match(/^\*?\*?第(\d+)题[（(]([^）)]+)[）)]\*?\*?[：:]?\s*(.*)/)
                    || trimmed.match(/^#+\s*第(\d+)题[（(]([^）)]+)[）)]\s*[：:]?\s*(.*)/);
        if (qMatch) {
          if (currentQuestion) htmlParts.push(renderSchemeQuestionBlock(currentQuestion));
          currentQuestion = { num: qMatch[1], meta: qMatch[2], knowledge: qMatch[3] || "", options: [], annotation: "" };
          continue;
        }
        const optMatch = trimmed.match(/^-\s*\[\s*\]\s*(.+)/);
        if (optMatch && currentQuestion) { currentQuestion.options.push(optMatch[1]); continue; }
        if (trimmed.startsWith("> 教师批注") || trimmed.startsWith(">教师批注")) { if (currentQuestion) currentQuestion._hasAnnotation = true; continue; }
        if (!trimmed || trimmed.startsWith("#") || trimmed.startsWith("[") || trimmed === "---" || trimmed.startsWith("**设计理念")) continue;
        if (currentQuestion && currentQuestion.options.length === 0 && !trimmed.startsWith("-")) {
          if (currentQuestion.knowledge && trimmed.length > 3) currentQuestion.knowledge += " " + trimmed;
          else if (trimmed.length > 3) currentQuestion.knowledge = trimmed;
        }
      }
      if (currentQuestion) htmlParts.push(renderSchemeQuestionBlock(currentQuestion));
      return htmlParts.join("") + `<div class="hint-box">每题已配独立批注区：勾选要考的考点、写批注，然后在右侧确认方案。</div>`;
    }

    function renderSchemeToChat(idx) {
      state._currentSchemeIdx = idx;
      const scheme = state.schemeSections[idx];
      if (!scheme || !scheme.scheme_md) return;
      // 替换而非堆叠：切方案时移除上一个方案消息（避免多方案批注串题）
      const stream = document.getElementById("messageStream");
      stream.querySelectorAll(".scheme-msg").forEach((el) => el.remove());
      addRichMessage(scheme.scheme_label || scheme.title || "方案详情", buildSchemeQuestionsHtml(scheme));
      const sel = document.getElementById("schemeSelect");
      if (sel) sel.value = String(idx);
    }

    function renderSchemeFlow(schemeSections) {
      state.schemeSections = schemeSections;
      document.getElementById("workspaceTitle").textContent = "方案 · 知识点对齐";
      document.getElementById("workspaceCaption").textContent = `${schemeSections.length} 套方案，已渲染到左侧对话区`;

      // 工作区只保留确认动作（方案本体在对话区，便于阅读 + 逐题批注）
      const body = document.getElementById("workspaceBody");
      body.innerHTML = `<div class="draft-info">方案已展示在左侧对话区——每题可勾选考点、写独立批注。确认后进入出题。</div>`;

      const footer = document.getElementById("workspaceFooter");
      footer.style.display = "block";
      footer.innerHTML = `
        ${schemeSections.length > 1 ? `
        <select id="schemeSelect" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:10px;">
          ${schemeSections.map((s, i) => `<option value="${i}">${escapeHtml(s.scheme_label || s.title)}</option>`).join("")}
        </select>` : ""}
        <button class="primary-btn" id="confirmSchemeBtn" style="width:100%" onclick="confirmScheme()">确认选定方案</button>
      `;
      if (schemeSections.length > 1) {
        document.getElementById("schemeSelect").addEventListener("change", (e) => renderSchemeToChat(parseInt(e.target.value)));
      }
      // 默认把第一套方案渲染进对话区
      renderSchemeToChat(0);
    }

    function viewScheme(idx) {
      const scheme = state.schemeSections[idx];
      if (!scheme || !scheme.scheme_md) return;

      // 高亮选中的边栏卡片
      document.querySelectorAll(".plan-card").forEach((el, i) => {
        if (i === idx) {
          el.style.borderColor = "#f4dccd";
          el.style.background = "var(--primary-soft)";
          el.classList.add("selected-scheme");
        } else {
          el.style.borderColor = "var(--border)";
          el.style.background = "var(--surface)";
          el.classList.remove("selected-scheme");
        }
      });

      // 浮动面板模式：替换整个聊天区（和 renderQuestionDetail 一样的模式）
      // 不用 marked.parse——手动渲染保证 checkbox 可点击、批注可编辑
      const stream = document.getElementById("messageStream");
      state._savedStreamHTML = stream.innerHTML;
      state._currentSchemeIdx = idx;

      // 解析 scheme_md 为可交互的 HTML
      // 支持两种题目标题格式：**第N题...** 和 ### 第N题...
      const lines = (scheme.scheme_md || '').split('\n');
      let htmlParts = [];
      let currentQuestion = null;

      for (const line of lines) {
        const trimmed = line.trim();
        // 题目标题行：**第N题（meta）**：知识点  或  ### 第N题（meta）：知识点
        const qMatch = trimmed.match(/^\*?\*?第(\d+)题[（(]([^）)]+)[）)]\*?\*?[：:]?\s*(.*)/) 
                    || trimmed.match(/^#+\s*第(\d+)题[（(]([^）)]+)[）)]\s*[：:]?\s*(.*)/);
        if (qMatch) {
          if (currentQuestion) htmlParts.push(renderQuestionBlock(currentQuestion));
          currentQuestion = {
            num: qMatch[1],
            meta: qMatch[2],
            knowledge: qMatch[3] || '',
            options: [],
            annotation: ''
          };
          continue;
        }
        // 细粒度考点选项：- [ ] xxx
        const optMatch = trimmed.match(/^-\s*\[\s*\]\s*(.+)/);
        if (optMatch && currentQuestion) {
          currentQuestion.options.push(optMatch[1]);
          continue;
        }
        // 批注区
        if (trimmed.startsWith('> 教师批注') || trimmed.startsWith('>教师批注')) {
          if (currentQuestion) { currentQuestion._hasAnnotation = true; }
          continue;
        }
        // 水平线/设计理念等非题目内容
        if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('[') || trimmed === '---' || trimmed.startsWith('**设计理念')) continue;
        // 其他文本行：如果有当前题目且还没选项，作为知识点补充
        if (currentQuestion && currentQuestion.options.length === 0 && !trimmed.startsWith('-')) {
          if (currentQuestion.knowledge && trimmed.length > 3) {
            currentQuestion.knowledge += ' ' + trimmed;
          } else if (trimmed.length > 3) {
            currentQuestion.knowledge = trimmed;
          }
        }
      }
      if (currentQuestion) htmlParts.push(renderQuestionBlock(currentQuestion));

      function renderQuestionBlock(q) {
        return `
          <div class="slot-card" style="margin-bottom:14px;">
            <div class="slot-head">
              <strong>第${q.num}题（${q.meta}）</strong>
            </div>
            <div class="slot-body">
              <p style="margin:0 0 8px;font-size:14px;">${escapeHtml(q.knowledge)}</p>
              ${q.options.map((opt, i) => `
                <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;">
                  <input type="checkbox" data-q="${q.num}" data-opt="${i}" style="width:18px;height:18px;cursor:pointer;">
                  <span>${escapeHtml(opt)}</span>
                </label>
              `).join('')}
              <div style="margin-top:8px;">
                <textarea placeholder="教师批注：对本题的修改意见..."
                  data-q-annotation="${q.num}"
                  style="width:100%;min-height:40px;font-size:13px;padding:8px;border:1px solid var(--border);border-radius:6px;">${escapeHtml(q.annotation)}</textarea>
              </div>
            </div>
          </div>
        `;
      }

      stream.innerHTML = `
        <div class="question-detail">
          <div class="detail-actions">
            <button class="secondary-btn" onclick="backToChatFromScheme()">← 返回对话</button>
          </div>
          <h3>${escapeHtml(scheme.scheme_label || scheme.title || '方案详情')}</h3>
          ${htmlParts.join('')}
          <div class="hint-box">勾选要考的细粒度考点，填写批注后，在右侧选择此方案并确认。</div>
        </div>
      `;

      // 同步选中下拉框
      const sel = document.getElementById("schemeSelect");
      if (sel) { sel.value = String(idx); const btn = document.getElementById("confirmSchemeBtn"); if (btn) btn.disabled = false; }
    }

    function backToChatFromScheme() {
      const stream = document.getElementById("messageStream");
      if (state._savedStreamHTML) {
        stream.innerHTML = state._savedStreamHTML;
        state._savedStreamHTML = null;
      }
      stream.scrollTop = stream.scrollHeight;
    }

    async function confirmScheme() {
      const idx = state._currentSchemeIdx ?? 0;
      const scheme = state.schemeSections && state.schemeSections[idx];
      if (!scheme) return;

      // 收集每题的勾选考点 + 独立批注（限定当前方案块，避免多方案串题）
      const scope = document.querySelector(".scheme-msg") || document;
      const notes = [];
      scope.querySelectorAll("[data-q-annotation]").forEach((ta) => {
        const q = ta.getAttribute("data-q-annotation");
        const txt = ta.value.trim();
        const checked = [...scope.querySelectorAll(`input[data-q="${q}"]:checked`)]
          .map((c) => (c.parentElement.textContent || "").trim())
          .filter(Boolean);
        if (txt || checked.length) {
          notes.push(`第${q}题：${checked.length ? "选考 " + checked.join("；") : ""}${txt ? (checked.length ? "；" : "") + "批注 " + txt : ""}`);
        }
      });
      const noteStr = notes.length ? "\n\n教师逐题意见：\n" + notes.join("\n") : "";
      const confirmMsg = `我选择${scheme.scheme_label || scheme.title}。请基于这套方案逐题锚定原卷知识点，生成交接文档进入出题。${noteStr}`;
      await sendMessageText(confirmMsg);
    }

    function intentFromDraft(draft) {
      if (draft.scenario === "A") return "考研模拟题组卷";
      if (draft.scenario === "B") return "知识点转型出题";
      if (draft.scenario === "C") return "自由出题";
      return "未识别";
    }

    function getSelectableSections(draft = state.draft) {
      return (draft?.sections || []).filter(section => (section.options || []).length > 0);
    }

    function isQuestionTypeSection(section) {
      if (section?.phase === "question_type") return true;
      const text = `${section.slot_id || ""} ${section.display_id || ""} ${section.title || ""}`;
      return /_type\b/i.test(section.slot_id || "") || text.includes("题型");
    }

    function sectionPhase(section) {
      if (section?.phase) return section.phase;
      if (isQuestionTypeSection(section)) return "question_type";
      return "combined";
    }

    function primaryDraftPhase(draft = state.draft) {
      const phases = getSelectableSections(draft)
        .map(sectionPhase)
        .filter(phase => phase !== "question_type");
      if (phases.includes("knowledge")) return "knowledge";
      if (phases.length && phases.every(phase => phase === "examination")) return "examination";
      if (phases.includes("examination") && !phases.includes("combined")) return "examination";
      return "combined";
    }

    function needsSecondRoundDraft(draft = state.draft) {
      return primaryDraftPhase(draft) === "knowledge";
    }

    function phaseLabel(phase) {
      return {
        knowledge: "选择知识点",
        examination: "选择考察方式",
        combined: "考点与方式",
        question_type: "选择题型"
      }[phase] || "选择";
    }

    function phaseGuidance(phase) {
      return {
        knowledge: "先确定要覆盖的粗知识点，下一轮会展开对应的考察方式。",
        examination: "基于已选知识点，选择最适合本题的具体考察方式。",
        combined: "该选项已合并知识点和考察方式，一次确认即可进入出题。",
        question_type: "选择本题最终采用的题型。"
      }[phase] || "";
    }

    function questionGroupKey(section, fallbackIndex = 0) {
      const slotId = section.slot_id || "";
      const displayId = section.display_id || "";
      const title = section.title || "";
      const match = slotId.match(/Q(\d+)/i) || displayId.match(/^(\d+)/) || title.match(/Q(\d+)/i);
      return match ? `Q${match[1]}` : `S${fallbackIndex + 1}`;
    }

    function questionDisplayId(groupKey, section) {
      const match = groupKey.match(/Q(\d+)/i);
      if (match) return match[1];
      const displayMatch = String(section.display_id || "").match(/^(\d+)/);
      return displayMatch ? displayMatch[1] : (section.display_id || section.slot_id || groupKey);
    }

    function cleanQuestionTitle(section) {
      const raw = section.title || "";
      const cleaned = raw
        .replace(/^\s*Q\d+\s*[（(][^）)]*[）)]\s*/, "")
        .replace(/^\s*Q\d+\s*/, "")
        .replace(/考察方向|考察内容|题型/g, "")
        .trim();
      return cleaned || "考察设置";
    }

    function getDraftQuestionGroups(draft = state.draft) {
      const groups = [];
      const byKey = new Map();
      (draft?.sections || []).forEach((section, sectionIndex) => {
        const key = questionGroupKey(section, sectionIndex);
        let group = byKey.get(key);
        if (!group) {
          group = {
            key,
            display_id: questionDisplayId(key, section),
            title: "",
            sections: []
          };
          byKey.set(key, group);
          groups.push(group);
        }
        const phase = sectionPhase(section);
        const kind = phase === "question_type" ? "type" : "focus";
        if (kind === "focus" && !group.title) group.title = cleanQuestionTitle(section);
        group.sections.push({ section, sectionIndex, kind, phase });
      });
      groups.forEach(group => {
        group.sections.sort((a, b) => (a.kind === "type") - (b.kind === "type"));
        if (!group.title && group.sections.length) {
          group.title = cleanQuestionTitle(group.sections[0].section);
        }
      });
      return groups;
    }

    function renderQuestionGroup(group) {
      const displayId = group.display_id || group.key;
      const title = group.title || "考察设置";
      const hasFocusSection = group.sections.some(entry => entry.kind === "focus");
      const groupPhase = group.sections.find(entry => entry.kind === "focus")?.phase || "combined";
      return `
        <div class="slot-card">
          <div class="slot-head">
            <strong>第 ${escapeHtml(displayId)} 题 · ${escapeHtml(title)}</strong>
            <span class="phase-badge">${escapeHtml(phaseLabel(groupPhase))}</span>
          </div>
          <div class="slot-body">
            ${group.sections.map(entry => renderSlotSection(entry, entry.kind === "focus" || !hasFocusSection)).join("")}
          </div>
        </div>
      `;
    }

    function renderSlotSection(entry, showComment) {
      const { section, sectionIndex, phase } = entry;
      const label = phaseLabel(phase);
      const guidance = phaseGuidance(phase);
      return `
        <div class="slot-subsection">
          <div class="subsection-label">${label}</div>
          ${guidance ? `<div class="slot-guidance">${escapeHtml(guidance)}</div>` : ""}
          ${section.options.map((option, oIndex) => renderOption(option, sectionIndex, oIndex)).join("")}
          ${showComment ? `<textarea class="comment-input" placeholder="批注（可选）"
            oninput="updateAnnotation(${sectionIndex}, this.value)">${escapeHtml(section.annotation || "")}</textarea>` : ""}
        </div>
      `;
    }

    function renderOption(option, sIndex, oIndex) {
      const selected = option.status === "selected";
      return `
        <div class="option-card ${selected ? "selected" : ""}" id="option-${sIndex}-${oIndex}" onclick="selectOption(${sIndex}, ${oIndex})" style="cursor:pointer">
          <div>
            <div class="option-title">${selected ? "✓ " : ""}${escapeHtml(option.text)}</div>
            <div class="option-desc">${escapeHtml(option.cognitive_desc || "")}</div>
          </div>
          <span style="font-size:13px;color:${selected ? 'var(--success)' : 'var(--primary)'}">${selected ? "✓ 已选择" : "点击选择"}</span>
        </div>
      `;
    }

    function selectOption(sIndex, oIndex) {
      const section = state.draft.sections[sIndex];
      section.options.forEach((opt, idx) => {
        opt.status = idx === oIndex ? "selected" : "unselected";
      });
      section.selected_option_id = section.options[oIndex].id;
      renderDraft(state.draft, intentFromDraft(state.draft));
    }

    function updateAnnotation(sIndex, value) {
      state.draft.sections[sIndex].annotation = value;
      updateDraftProgress();
    }

    function hasDraftAnnotations(draft = state.draft) {
      return (draft?.sections || []).some(section => (section.annotation || "").trim());
    }

    function getCompletedCount() {
      if (!state.draft) return 0;
      return getSelectableSections().filter(section => section.options.some(opt => opt.status === "selected")).length;
    }

    function updateDraftProgress() {
      const complete = getCompletedCount();
      const total = getSelectableSections().length;
      const progressText = document.getElementById("draftProgressText");
      const submitBtn = document.getElementById("submitDraftBtn");

      if (progressText) progressText.innerHTML = `<strong>${complete}</strong> / ${total} 已选择`;
      if (submitBtn) {
        submitBtn.disabled = complete < total;
        if (!submitBtn.disabled) submitBtn.textContent = getSubmitButtonText(state.draft);
      }
    }

    function renderDraftFooter() {
      const footer = document.getElementById("workspaceFooter");
      footer.style.display = "block";
      const total = getSelectableSections().length;
      footer.innerHTML = `
        <div class="progress-line">
          <span id="draftProgressText"><strong>0</strong> / ${total} 已选择</span>
          <span>${state.draft.current_round ? `Round ${state.draft.current_round}` : ""}</span>
        </div>
        <button class="primary-btn" id="submitDraftBtn" style="width:100%" onclick="submitDraft()" disabled>
          ${getSubmitButtonText(state.draft)}
        </button>
      `;
    }

    function buildAnnotationPayload(draft) {
      return {
        draft_id: draft.draft_id,
        slots: draft.sections.map(section => {
          const selected = section.options.find(opt => opt.status === "selected");
          const selectedId = selected ? selected.id : section.selected_option_id;
          return {
            slot_id: section.slot_id,
            selected_option_id: selectedId,
            kept_options: selectedId ? [selectedId] : [],
            removed_options: section.options.filter(opt => opt.id !== selectedId).map(opt => opt.id),
            annotation: section.annotation || "",
            modified_text: {}
          };
        })
      };
    }

    async function submitDraft() {
      if (!state.draft) return;
      const submitBtn = document.getElementById("submitDraftBtn");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "提交中";
      }

      try {
        const sessionId = await ensureSession();
        const annotationPayload = buildAnnotationPayload(state.draft);
        const hasRevisionRequest = hasDraftAnnotations(state.draft);
        await api.annotate(sessionId, annotationPayload);

        const needsSecondRound = needsSecondRoundDraft(state.draft);

        if (needsSecondRound) {
          /* Knowledge phase → request examination phase */
          addMessage("teacher", "已确认考察范围和题型选择，请展开考察方式。");
          setStage("collecting");
          renderGeneratingDraft();

          const turn = await api.turn(sessionId, "已确认第一轮考察范围和题型选择。请读取 compose/interact_draft.md，只围绕已选粗知识域和题型展开具体考察方式，生成第二轮草案。[SCENARIO: C][ROUND: 2][PHASE: examination]", "discuss");
          addMessage("agent", turn.response_text || "正在生成第二轮草案…", turn.has_draft);
          if (turn.has_draft) {
            state.draft = normalizeDraft(await api.getDraft(sessionId));
            document.getElementById("taskSubtitle").textContent = getDraftHint(state.draft);
            renderDraft(state.draft, intentFromDraft(state.draft));
            setStage("reviewing");
          } else {
            renderClarificationPanel();
          }
          return;
        }

        if (hasRevisionRequest) {
          addMessage("teacher", "已提交批注，请先调整草案。");
          addMessage("agent", "我会根据批注修订方案，暂不进入出题流水线。");
          setStage("collecting");
          renderGeneratingDraft();

          const turn = await api.turn(
            sessionId,
            "教师对草案提出了修改批注。请读取 compose/interact_draft.md，严格根据教师批注修订草案，并重新 write_file 到 compose/interact_draft.md。不要生成 paper_request.yaml 或 slot_blueprint.yaml，不要进入出题流水线；只返回修订后的可选草案。",
            "request_revision"
          );
          addMessage("agent", turn.response_text || "草案已根据批注调整，请重新确认。", turn.has_draft);
          if (turn.has_draft) {
            state.draft = normalizeDraft(await api.getDraft(sessionId));
            document.getElementById("taskSubtitle").textContent = getDraftHint(state.draft);
            renderDraft(state.draft, intentFromDraft(state.draft));
            setStage("reviewing");
          } else if (turn.has_result) {
            setStage("generating");
            renderGeneratingQuestions();
            startPollingDisplayResult();
          } else {
            renderClarificationPanel();
          }
          return;
        }

        /* Final submission: Scenario A/B single-round, or Scenario C Round 2+ */
        const slotCount = getDraftQuestionGroups(state.draft).length;

        addMessage("teacher", "草案已确认，请生成正式题目。");
        addMessage("agent", `出题团队正在辛苦施工中，共 ${slotCount} 题，请稍候…`);
        setStage("generating");
        renderGeneratingCards(slotCount);

        const turn = await api.turn(sessionId, "教师已确认草案选择，请生成交接文档（paper_request.yaml 或 slot_blueprint.yaml）。", "confirm_handoff");
        if (turn.response_text) addMessage("agent", turn.response_text);
        if (turn.has_result) {
          /* Agent directly produced the handoff YAML */
          addMessage("agent", "交接文档已生成，出题流水线启动中…");
        }
        startPollingDisplayResult(slotCount);
      } catch (error) {
        addMessage("agent", `提交失败：${error.message || error}`);
        if (submitBtn) {
          submitBtn.textContent = getSubmitButtonText(state.draft);
          updateDraftProgress();
        }
      }
    }

    function renderGeneratingQuestions() {
      renderGeneratingCards(0);
    }

    function renderGeneratingCards() {
      document.getElementById("workspaceTitle").textContent = "逐题生成中";
      document.getElementById("workspaceCaption").textContent = "每题独立施工，实时推进";
      document.getElementById("workspaceFooter").style.display = "none";
      document.getElementById("workspaceBody").innerHTML = `
        <div id="genCardsSummary" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;">
          <span id="genCardsCount" style="color:var(--muted)">正在启动出题流水线…</span>
          <span id="genCardsPct" style="color:var(--muted);font-variant-numeric:tabular-nums"></span>
        </div>
        <div style="height:4px;border-radius:999px;background:var(--border);overflow:hidden;margin-bottom:14px">
          <div id="genOverallFill" style="height:100%;width:0%;background:var(--primary);transition:width 600ms ease"></div>
        </div>
        <div id="genCardsGrid" class="gen-cards-grid"></div>
      `;
    }

    // 每题 stage → 步进序号（0 选项设计 / 1 求解 / 2 审核 / 3 排版 / 5 完成 / -1 排队 / -2 失败）
    const _GEN_STAGE_STEPS = [
      { pattern: /选项设计|设计卡|design/i },
      { pattern: /求解|solve/i },
      { pattern: /审核|review/i },
      { pattern: /排版|终审|final/i },
    ];
    const _GEN_DONE_RE = /已完成|completed/i;
    const _GEN_STEP_LABELS = ["选项设计中", "求解中", "审核中", "排版中", "已完成"];

    function _genStageActive(stage, status) {
      if (status === "completed" || (stage && _GEN_DONE_RE.test(stage))) return 5;
      if (status === "failed") return -2;
      if (!stage) return -1;
      for (let i = 0; i < _GEN_STAGE_STEPS.length; i++) {
        if (_GEN_STAGE_STEPS[i].pattern.test(stage)) return i;
      }
      return -1;
    }

    function _renderGenCardInner(label, status, stage) {
      const active = _genStageActive(stage, status);
      let dots = "";
      for (let i = 0; i < 5; i++) {
        let cls = "gdot";
        if (active === 5 || i < active) cls += " done";
        else if (i === active) cls += " active";
        dots += `<span class="${cls}"></span>`;
        if (i < 4) dots += `<span class="gline${i < active || active === 5 ? " done" : ""}"></span>`;
      }
      const stageLabel = active === 5 ? "已完成"
        : active === -2 ? "失败"
        : active === -1 ? "排队中"
        : (_GEN_STEP_LABELS[active] || stage || "排队中");
      let badge;
      if (status === "completed") badge = `<span class="badge" style="color:var(--success);background:var(--success-soft)">✓ 完成</span>`;
      else if (status === "failed") badge = `<span class="badge" style="color:var(--danger);background:var(--danger-soft)">失败</span>`;
      else if (status === "generating") badge = `<span class="badge" style="color:var(--primary);background:var(--primary-soft)">生成中</span>`;
      else badge = `<span class="badge" style="color:var(--muted);background:var(--surface-soft)">排队</span>`;
      const pct = active === 5 ? 100 : active >= 0 ? Math.round((active / 4) * 100) : 0;
      return `
        <div class="gen-card-head"><strong>${escapeHtml(label)}</strong>${badge}</div>
        <div class="gen-steps">${dots}</div>
        <div class="gen-stage-label">${escapeHtml(stageLabel)}</div>
        <div class="gen-bar"><div class="gen-fill" style="width:${pct}%"></div></div>
      `;
    }

    function updateGeneratingCards(pipeline) {
      const grid = document.getElementById("genCardsGrid");
      if (!grid) return;
      const entries = pipeline && pipeline.slots ? Object.entries(pipeline.slots) : [];
      const countEl = document.getElementById("genCardsCount");
      const pctEl = document.getElementById("genCardsPct");
      const overallFill = document.getElementById("genOverallFill");

      if (entries.length === 0) return; // 等待启动，summary 保持默认文案

      // 以 slot_id 为 key 原地更新（不重挂，保留过渡连续性）
      const existing = new Map();
      grid.querySelectorAll(".gen-card").forEach((el) => existing.set(el.dataset.sid, el));

      let completed = 0;
      for (const [sid, s] of entries) {
        const status = (s && s.status) || "waiting";
        const stage = (s && s.stage) || "";
        const label = (s && s.label) || sid;
        if (status === "completed") completed++;
        let card = existing.get(sid);
        if (!card) {
          card = document.createElement("div");
          card.className = "gen-card";
          card.dataset.sid = sid;
          grid.appendChild(card);
        }
        card.dataset.status = status;
        card.innerHTML = _renderGenCardInner(label, status, stage);
        existing.delete(sid);
      }
      // 防御：移除已从 pipeline 消失的 slot 卡（正常不会发生，但避免孤儿卡残留）
      existing.forEach((el) => el.remove());
      const total = entries.length;
      const pct = total ? Math.round((completed / total) * 100) : 0;
      if (countEl) countEl.textContent = `${completed} / ${total} 题完成`;
      if (pctEl) pctEl.textContent = pct + "%";
      if (overallFill) overallFill.style.width = pct + "%";
    }

    function updateGeneratingProgress(done, total) {
      const fill = document.getElementById("genProgressFill");
      const label = document.getElementById("genProgressLabel");
      if (!fill) return;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      fill.style.width = pct + "%";
      if (label) {
        if (done >= total && total > 0) {
          label.textContent = `全部完成！共 ${total} 题，正在整理结果…`;
        } else {
          label.textContent = `已完成 ${done} / ${total} 题（${pct}%）`;
        }
      }
    }

    function updatePipelineStepUI(stageText, label) {
      /* Map Chinese stage names to pipeline step indices */
      const stageMap = [
        { pattern: /大纲|流水线生成|outline/i, index: 0 },
        { pattern: /设计卡|选项设计|design/i, index: 1 },
        { pattern: /题目|生成中|question/i, index: 2 },
        { pattern: /审核|review/i, index: 3 },
        { pattern: /求解|solve/i, index: 4 },
        { pattern: /终审|排版|final/i, index: 5 },
      ];

      let activeIndex = -1;
      for (const m of stageMap) {
        if (m.pattern.test(stageText)) {
          activeIndex = m.index;
          break;
        }
      }

      /* Update each step's visual state */
      for (let i = 0; i < 6; i++) {
        const step = document.getElementById(`pipelineStep${i}`);
        const status = document.getElementById(`pipelineStepStatus${i}`);
        if (!step) continue;

        if (i < activeIndex) {
          step.style.opacity = "1";
          step.style.background = "var(--success-soft)";
          if (status) status.textContent = "✓ 完成";
          if (status) status.style.color = "var(--success)";
        } else if (i === activeIndex) {
          step.style.opacity = "1";
          step.style.background = "var(--primary-soft)";
          step.style.borderLeft = "3px solid var(--primary)";
          if (status) status.innerHTML = '<span class="spinner" style="width:12px;height:12px;border-width:2px;display:inline-block;vertical-align:middle"></span> 进行中';
          if (status) status.style.color = "var(--primary)";
        } else {
          step.style.opacity = "0.4";
          step.style.background = "var(--surface-soft)";
          step.style.borderLeft = "none";
          if (status) status.textContent = "等待中";
          if (status) status.style.color = "var(--muted)";
        }
      }

      const genLabel = document.getElementById("genProgressLabel");
      if (genLabel && label) {
        genLabel.textContent = `${label}：${stageText}`;
      }
    }

    async function startPollingDisplayResult(slotCount) {
      if (!state.sessionId) return;
      if (state.pollTimer) clearInterval(state.pollTimer);

      let attempts = 0;
      let done = false;
      const totalSlots = slotCount || 0;
      const poll = async () => {
        attempts += 1;
        try {
          /* Fetch both display-result and pipeline-progress in parallel */
          const [result, pipeline] = await Promise.all([
            api.getDisplayResult(state.sessionId),
            api.getPipelineProgress(state.sessionId).catch(() => null),
          ]);

          /* 每题进度卡：按各 slot 真实 stage 实时推进 */
          updateGeneratingCards(pipeline);
          if ((!pipeline || !pipeline.slots || Object.keys(pipeline.slots || {}).length === 0) && result.status === "pending") {
            const summary = document.getElementById("genCardsCount");
            if (summary) summary.textContent = `正在启动出题流水线… (已等待 ${attempts * 3}s)`;
          }

          if (result.status === "pending" || result.status === "partial") {
            // 生成中：保持每题进度卡（partial 时部分卡已 ✓），不切到结果列表——
            // 让用户看到每题独立推进到完成，剧场不被提前打断
            state.results = result;
            if (result.status === "pending" && attempts >= 120) {
              addMessage("agent", result.message || "题目仍在生成，请稍后刷新结果。");
              clearInterval(state.pollTimer);
              done = true;
            }
            return;
          }

          if (result.status === "completed") {
            state.results = result;
            clearInterval(state.pollTimer);
            done = true;
            updateGeneratingCards(pipeline); // 最后刷一次（全部 ✓）
            addMessage("agent", result.message || "题目已生成完成。你可以在右侧查看题目或预览整卷 Markdown。");
            setStage("completed");
            renderResultList(); // 全完成 → 切最终结果列表
          } else if (result.status === "failed") {
            clearInterval(state.pollTimer);
            done = true;
            addMessage("agent", result.message || "题目生成失败。");
          }
        } catch (error) {
          clearInterval(state.pollTimer);
          done = true;
          addMessage("agent", `获取结果失败：${error.message || error}`);
        }
      };

      await poll();
      if (!done) state.pollTimer = setInterval(poll, 3000);
    }

    function renderResultList() {
      const questions = state.results.questions || [];
      const completed = questions.filter(q => q.status === "completed");
      const generating = questions.filter(q => q.status !== "completed");
      const allDone = completed.length === questions.length && questions.length > 0;

      document.getElementById("workspaceTitle").textContent = allDone ? "题目结果" : "题目生成中";
      document.getElementById("workspaceCaption").textContent =
        allDone ? "点击题目查看详情，或预览整卷"
                : `已完成 ${completed.length} / ${questions.length} 题，正在生成中…`;

      const body = document.getElementById("workspaceBody");
      body.innerHTML = `
        ${questions.map((q, index) => {
          const label = q.progress_label || (q.status === "completed" ? "已完成" : "等待中");
          return `
          <div class="result-card ${q.status}" style="display:flex;align-items:center;gap:12px;justify-content:space-between">
            <div style="flex:1;min-width:0">
              <strong>${escapeHtml(q.display_id || q.slot_id)} · ${escapeHtml(q.title)}</strong>
              ${q.status === "completed"
                ? '<span style="color:var(--success);font-size:13px">✓ 已完成</span>'
                : `<span style="color:var(--muted);font-size:13px"><span class="spinner" style="width:12px;height:12px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:4px"></span>${escapeHtml(label)}</span>`}
            </div>
            <div class="result-actions" style="flex-shrink:0">
              ${q.status === "completed"
                ? `<button class="mini-btn" onclick="openQuestionByIndex(${index})">查看题目</button>`
                : `<button class="mini-btn" disabled style="opacity:0.5">等待生成</button>`}
            </div>
          </div>`;
        }).join("") || '<div class="empty-panel"><div>暂无题目结果。</div></div>'}
      `;

      document.getElementById("workspaceFooter").style.display = "block";
      document.getElementById("workspaceFooter").innerHTML = allDone ? `
        <div class="result-actions">
          <button class="primary-btn" style="flex:1" onclick="openPaperPreview()">整卷预览</button>
          <button class="secondary-btn" style="flex:1" onclick="downloadMarkdown()">下载 Markdown</button>
        </div>
      ` : `
        <div style="text-align:center;padding:8px;color:var(--muted);font-size:13px">
          🚧 出题团队仍在施工中，题目完成后会自动可点击查看…
        </div>
      `;
    }

    function openQuestion(slotId) {
      const q = state.results.questions.find(item => item.slot_id === slotId);
      if (!q) return;
      renderQuestionDetail(q);
    }

    function openQuestionByIndex(index) {
      const q = state.results.questions[index];
      if (!q) return;
      renderQuestionDetail(q);
    }

    function renderQuestionDetail(q) {
      const label = q.display_id || q.slot_id;
      state.selectedQuestionId = q.slot_id;
      document.getElementById("centerTitle").textContent = `${label} · ${q.title}`;
      document.getElementById("centerCaption").textContent = "题目详情：题目 + 答案解析 + 教师批注";

      const stream = document.getElementById("messageStream");
      stream.innerHTML = `
        <div class="question-detail">
          <div class="detail-actions">
            <button class="secondary-btn" onclick="backToChat()">返回对话</button>
            <button class="secondary-btn" onclick="renderResultList()">返回题目列表</button>
            <button class="secondary-btn" onclick="copyQuestion('${q.slot_id}')">复制本题</button>
          </div>
          <h3>${escapeHtml(label)} · ${escapeHtml(q.title)}</h3>
          <h4>题目</h4>
          <div class="md-body">${marked.parse(q.stem || "")}</div>
          <ol type="A">
            ${q.options.map(opt => `<li>${escapeHtml(opt)}</li>`).join("")}
          </ol>

          <h4>答案与解析</h4>
          <p><strong>答案：</strong>${escapeHtml(q.answer)}</p>
          <div class="md-body">${marked.parse(q.explanation || "")}</div>

          <div class="annotation-box">
            <h4>教师批注 / 修改意见</h4>
            <div class="annotation-hint">这里填写对本题的修改意见。当前会先保存批注；单题重生成需要接入后端修订流程。</div>
            <textarea id="questionAnnotation" placeholder="例如：题目太简单；希望增加一步参数陷阱；不要考这个知识点；选项干扰性不够。">${escapeHtml(q.annotation || "")}</textarea>
            <div class="revision-actions">
              <button class="primary-btn" onclick="submitInlineAnnotationCurrent('comment_only')">提交批注</button>
              <button class="secondary-btn" onclick="submitInlineAnnotationCurrent('regenerate_question')">提交重生成意见</button>
            </div>
          </div>
        </div>
      `;
    }

    function openRevision(slotId) {
      openQuestion(slotId);
    }

    async function submitInlineAnnotationCurrent(action = "comment_only") {
      const slotId = state.selectedQuestionId;
      if (!slotId || !state.sessionId) return;
      const textarea = document.getElementById("questionAnnotation");
      const text = textarea ? textarea.value.trim() : "";
      if (!text) {
        alert("请先填写批注或修改意见。");
        return;
      }
      try {
        const result = await api.annotateQuestion(state.sessionId, slotId, {
          annotation: text,
          action
        });
        const q = state.results.questions.find(item => item.slot_id === slotId);
        if (q) q.annotation = text;
        alert(result.message || "批注已提交。");
      } catch (error) {
        alert(`提交批注失败：${error.message || error}`);
      }
    }

    function submitRevisionPlaceholder() {
      alert("已提交批注。当前版本为 UI 占位，后续接入后端修订接口。");
    }

    function openPaperPreview() {
      document.getElementById("centerTitle").textContent = "整卷预览";
      document.getElementById("centerCaption").textContent = "前半部分为题目，后半部分为答案与解析";

      const md = buildPaperMarkdown();
      document.getElementById("messageStream").innerHTML = `
        <div class="detail-actions" style="max-width:860px;margin:0 auto 12px">
          <button class="secondary-btn" onclick="backToChat()">返回对话</button>
          <button class="secondary-btn" onclick="downloadMarkdown()">下载 Markdown</button>
        </div>
        <div class="markdown-preview">${marked.parse(md)}</div>
      `;
    }

    function buildPaperMarkdown() {
      if (state.results && state.results.paper_markdown) {
        return state.results.paper_markdown;
      }
      return `# ${state.results.title}

## 一、试题

${state.results.questions.map(q => `### ${q.display_id || q.slot_id} ${q.title}

${q.stem}

${q.options.map((opt, i) => `${String.fromCharCode(65 + i)}. ${opt}`).join("\n")}`).join("\n\n")}

## 二、答案与解析

${state.results.questions.map(q => `### ${q.display_id || q.slot_id} ${q.title}

**答案：${q.answer}**

**解析：**
${q.explanation}`).join("\n\n")}

## 三、教师批注

> 可在此处记录需要修改、替换或重生成的题目。
`;
    }

    async function downloadMarkdown() {
      let blob;
      if (state.sessionId) {
        try {
          const response = await api.downloadPaper(state.sessionId);
          blob = await response.blob();
        } catch (_) {}
      }
      if (!blob) {
        const md = buildPaperMarkdown();
        blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "paper_with_answers.md";
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyQuestion(slotId) {
      const q = state.results.questions.find(item => item.slot_id === slotId);
      if (!q) return;
      const text = `${q.slot_id} ${q.title}\n\n${q.stem}\n\n${q.options.map((opt, i) => `${String.fromCharCode(65 + i)}. ${opt}`).join("\n")}\n\n答案：${q.answer}\n解析：${q.explanation}`;
      navigator.clipboard?.writeText(text);
      alert("已复制本题。");
    }

    function backToChat() {
      document.getElementById("centerTitle").textContent = "对话";
      document.getElementById("centerCaption").textContent = "输入需求，选择草案，等待生成题目";
      const stream = document.getElementById("messageStream");
      stream.innerHTML = "";
      addMessage("agent", "你可以在右侧继续查看题目结果，或预览并下载整卷 Markdown。");
    }

    // ── Session list management ──

    function sessionStateLabel(stateValue) {
      return {
        collecting: "收集中",
        reviewing: "待选择",
        confirmed: "已确认",
        generating: "生成中",
        completed: "已完成"
      }[stateValue] || stateValue || "收集中";
    }

    function sessionScenarioLabel(scenario) {
      return { A: "408组卷", B: "知识点出题", C: "自由组卷" }[scenario] || "";
    }

    function sessionTimeLabel(createdAt) {
      if (!createdAt) return "";
      const date = new Date(createdAt * 1000);
      if (Number.isNaN(date.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `任务 ${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function sessionDisplayTitle(sessionLike) {
      const title = (sessionLike?.title || "").trim();
      if (title) return title;
      return sessionScenarioLabel(sessionLike?.scenario) || sessionTimeLabel(sessionLike?.created_at) || "未命名任务";
    }

    async function loadSessionList() {
      const container = document.getElementById("historySessions");
      if (!container) return;
      try {
        const sessions = await api.listSessions();
        if (!sessions || sessions.length === 0) {
          container.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px">暂无历史任务</div>';
          return;
        }
        container.innerHTML = sessions
          .filter(s => s.session_id !== state.sessionId)
          .map(s => {
            const stateLabel = sessionStateLabel(s.state);
            const displayTitle = sessionDisplayTitle(s);
            const isActive = s.session_id === state.sessionId;
            const providerLabel = s.provider === "glm5.1" ? "GLM" : "Qwen";
            return `
            <div class="session-card ${isActive ? 'active' : ''}" style="cursor:pointer" onclick="switchSession('${s.session_id}')">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <strong style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(displayTitle)}</strong>
                <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
                  <span style="font-size:10px;color:var(--muted)">${providerLabel}</span>
                  <span class="status-tag" style="font-size:11px">${stateLabel}</span>
                  <button class="icon-button" style="width:24px;height:24px;font-size:12px;background:transparent;color:var(--danger)" onclick="event.stopPropagation();deleteSessionConfirm('${s.session_id}')" title="删除">✕</button>
                </div>
              </div>
            </div>`;
          }).join("") || '<div style="color:var(--muted);font-size:13px;padding:8px">暂无其他任务</div>';
      } catch (e) {
        container.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px">加载失败</div>';
      }
    }

    async function deleteSessionConfirm(sessionId) {
      if (!confirm(`确定要删除任务 ${sessionId} 吗？`)) return;
      try {
        await api.deleteSession(sessionId);
        if (sessionId === state.sessionId) {
          resetSession();
        }
        loadSessionList();
      } catch (e) {
        alert("删除失败：" + (e.message || e));
      }
    }

    async function switchSession(sessionId) {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.sessionId = sessionId;
      state.draft = null;
      state.results = null;
      state.selectedQuestionId = null;
      state.pollTimer = null;
      localStorage.setItem(sessionStorageKey(), sessionId);

      // Clear UI
      document.getElementById("messageStream").innerHTML = '<div class="spinner" style="margin:40px auto"></div>';
      document.getElementById("workspaceBody").innerHTML = '<div class="empty-panel"><div><div class="spinner" style="margin:0 auto"></div></div></div>';
      document.getElementById("workspaceFooter").style.display = "none";

      // Load history and restore UI
      await loadSessionContent(sessionId);
      loadSessionList();
    }

    async function loadSessionContent(sessionId) {
      try {
        const history = await api.getSessionHistory(sessionId);

        // Update "当前任务" card
        const displayTitle = sessionDisplayTitle(history);
        const stateLabel = sessionStateLabel(history.state);

        document.getElementById("taskTitle").textContent = displayTitle;
        document.getElementById("currentSessionDesc").textContent = displayTitle;
        document.getElementById("currentSessionStatus").textContent = stateLabel;
        document.getElementById("taskSubtitle").textContent = {
          collecting: "继续输入需求或补充约束",
          reviewing: "请选择草案中的候选项",
          confirmed: "已确认草案，等待出题流水线",
          generating: "题目生成中",
          completed: "题目已生成完成"
        }[history.state] || "任务已加载";

        // Render chat messages
        const stream = document.getElementById("messageStream");
        stream.innerHTML = "";
        if (history.messages && history.messages.length > 0) {
          for (const msg of history.messages) {
            addMessage(msg.role, msg.content);
          }
        } else {
          stream.innerHTML = '<div class="empty-panel"><div>暂无对话记录</div></div>';
        }

        // Restore workspace based on state
        if (history.state === "completed") {
          setStage("completed");
          try {
            const result = await api.getDisplayResult(sessionId);
            if (result && result.questions) {
              state.results = result;
              renderResultList();
            }
          } catch (_) {}
        } else if (history.state === "confirmed" || history.state === "generating") {
          setStage("generating");
          try {
            const result = await api.getDisplayResult(sessionId);
            const pipeline = await api.getPipelineProgress(sessionId).catch(() => null);
            if (result && result.questions && result.questions.length > 0) {
              state.results = result;
              renderResultList();
              if (result.status === "completed") {
                setStage("completed");
              }
            } else if (pipeline && pipeline.status === "running") {
              renderGeneratingCards(pipeline.total_slots || 1);
              startPollingDisplayResult(pipeline.total_slots || 1);
            } else {
              renderGeneratingCards(0);
            }
          } catch (_) {
            renderGeneratingCards(0);
          }
        } else if (history.state === "reviewing") {
          setStage("reviewing");
          // Try to load draft
          try {
            const draft = await api.getDraft(sessionId);
            if (draft && draft.sections) {
              state.draft = normalizeDraft(draft);
              renderDraft(state.draft);
            }
          } catch (_) {}
        } else {
          setStage("collecting");
        }
      } catch (e) {
        const message = e.message || String(e);
        if (/not found|Session .* not found|404/.test(message)) {
          localStorage.removeItem(sessionStorageKey());
          resetSession();
          addMessage("agent", "历史任务不存在或已删除，请新建任务。");
          return;
        }
        addMessage("agent", "加载会话历史失败：" + message);
      }
    }

    function fillPrompt(text) {
      const el = document.getElementById("teacherInput");
      if (!el) return;
      el.value = text;
      el.focus();
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetSession() {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.stage = "collecting";
      state.sessionId = null;
      state.draft = null;
      state.results = null;
      state.selectedQuestionId = null;
      state.pollTimer = null;
      localStorage.removeItem(sessionStorageKey());
      loadSessionList();

      document.getElementById("taskTitle").textContent = "教师交互出题工作台";
      document.getElementById("taskSubtitle").textContent = "系统自动判断模式并生成可选择草案";
      document.getElementById("currentSessionDesc").textContent = "尚未输入需求";
      document.getElementById("centerTitle").textContent = "对话";
      document.getElementById("centerCaption").textContent = "输入需求，选择草案，等待生成题目";
      document.getElementById("teacherInput").value = "";

      document.getElementById("messageStream").innerHTML = `
        <div class="empty-guide" id="emptyGuide">
          <h3>本系统支持四种出题模式</h3>
          
          <div class="support-modes mode-cards">
            <div class="mode-card" onclick="fillPrompt('出一套组成原理考研模拟卷，5 道选择题，覆盖数据通路、Cache、指令流水线')">
              <strong>考研模拟题组卷</strong>
              <span>例：组成原理考研模拟卷，5 道选择题</span>
            </div>
            <div class="mode-card" onclick="fillPrompt('出一道 AVL 树旋转的选择题，包含 LR 和 RL 旋转')">
              <strong>知识点转型出题</strong>
              <span>例：AVL 树旋转选择题，包含 LR 和 RL</span>
            </div>
            <div class="mode-card" onclick="fillPrompt('出一套数据结构期末卷，5 道选择题')">
              <strong>自由出题</strong>
              <span>例：数据结构期末卷，5 道选择题</span>
            </div>
            <div class="mode-card" onclick="fillPrompt('请参考 data/计算机组成原理A卷_题干与表格.md 出一套【考点对应】的卷——逐题锚定原卷每道题的知识点，考察角度可换不同切面（也可换成 data/ 下其他往年卷）')">
              <strong>往年试卷 · 知识点对齐（方案 D）</strong>
              <span>参考往年卷，逐题同考点、新考法（点选填模板，改路径即可）</span>
            </div>
          </div>
        </div>
      `;

      document.getElementById("workspaceTitle").textContent = "草案与结果";
      document.getElementById("workspaceCaption").textContent = "草案会在这里展示";
      document.getElementById("workspaceBody").innerHTML = `
        <div class="empty-panel">
          <div>
            <div class="icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="17" rx="2"/><path d="M9 4.5V3a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 3v1.5"/><path d="M9 11h6M9 14.5h4"/></svg></div>
            <div>输入需求后，右侧会展示对应草案。</div>
          </div>
        </div>
      `;
      document.getElementById("workspaceFooter").style.display = "none";
      setStage("collecting");
    }

    // ── Session persistence: restore on page load ──
    const userLabel = document.getElementById("currentUserLabel");
    if (userLabel) userLabel.textContent = USER_ID;
    loadSessionList();
    (async function initFromSavedSession() {
      const savedId = localStorage.getItem(sessionStorageKey());
      if (!savedId) return;

      state.sessionId = savedId;
      await loadSessionContent(savedId);
    })();
  </script>
</body>
</html>
