schema_version: paper_request_v1

source:
  intake_type: interact_agent
  scenario: C_free_compose

assessment:
  type: topic_practice
  subjects: ["操作系统", "组成原理", "数据结构"]
  total_score: 32
  duration_minutes: 60

knowledge_scope:
  primary_chapters:
    - "操作系统 > 进程管理"
    - "组成原理 > 数据的表示和运算"
    - "数据结构 > 树与二叉树"
  focus_points:
    - "进程与线程的概念辨析"
    - "虚拟内存局部性原理"
    - "补码加减交替法除法"
    - "IEEE754 浮点加减运算"
    - "二叉排序树与平衡旋转"
  excluded_points: []
  coverage_strategy: balanced

question_config:
  types:
    - type: concept
      count_range: [2, 2]
      score_per: 4
    - type: single_choice
      count_range: [1, 1]
      score_per: 2
    - type: comprehensive
      count_range: [1, 1]
      score_per: 10
    - type: comprehensive
      count_range: [1, 1]
      score_per: 12

difficulty:
  target: medium_hard
  distribution:
    easy: 15
    medium: 55
    hard: 30

# 四个 slot 覆盖四种类型，含完整设计意图字段
slots:
  # ===== 1. 概念题（批量，2个考点合并一次出）=====
  - slot_id: Q_CONCEPT
    question_type: concept
    complexity: conceptual
    score: 8
    target_subject: "操作系统"
    primary_target_name: "进程与线程区别, 虚拟内存局部性原理"
    target_difficulty: 2
    k_dominant: "K1"
    examination_mode: "概念辨析型——进程线程区别、虚拟内存局部性原理"
    teacher_annotation: "考基础概念理解，出2道，每考点一道。干扰项要对应真实认知错误。"
    concept_topics:
      - "进程与线程的区别（资源分配、调度、切换开销）"
      - "虚拟内存的局部性原理（时间局部性、空间局部性）"

  # ===== 2. 选择题（K3 算法题，新架构+干扰项）=====
  - slot_id: Q_CHOICE
    question_type: single_choice
    complexity: standard
    score: 2
    target_subject: "组成原理"
    target_family: "组成原理 > 数据的表示和运算 > IEEE754"
    primary_target_name: "IEEE754 浮点加减运算结果判断"
    target_difficulty: 3
    k_radar: {K1: 2, K2: 2, K3: 3, K4: 3, K5: 1}
    k_dominant: "K3"
    difficulty_rationale: "需理解浮点加减的对阶、规格化、舍入步骤，判断最终结果正确性，属中等难度。"
    examination_mode: "计算型——给定两个IEEE754浮点数相加，判断结果的阶码/尾数/是否溢出"
    teacher_annotation: "选项A为正确结果，BCD为真实计算错误（对阶错向、规格化方向错、舍入错）。"

  # ===== 3. 综合题（K3 计算题，标准难度，新架构）=====
  - slot_id: Q_COMP
    question_type: comprehensive
    complexity: standard
    score: 10
    target_subject: "组成原理"
    target_family: "组成原理 > 数据的表示和运算 > 定点除法"
    primary_target_name: "补码加减交替法除法运算"
    target_difficulty: 3
    k_radar: {K1: 2, K2: 1, K3: 4, K4: 2, K5: 1}
    k_dominant: "K3"
    difficulty_rationale: "需多步串行推演补码除法迭代过程（加减交替、移位、上商、末位修正），属中等偏难。"
    examination_mode: "计算型——补码加减交替法除法逐步计算"
    hard_constraints:
      - "被除数和除数均为定点小数补码"
      - "必须用加减交替法（不恢复余数法）"
    teacher_annotation: "考察完整除法过程，要求每步余数/商位/操作说明。"

  # ===== 4. 融合题（K4 高难度，考点融合——同知识点多考察项）=====
  - slot_id: Q_FUSION
    question_type: comprehensive
    complexity: standard
    score: 12
    target_subject: "数据结构"
    target_family: "数据结构 > 树与二叉树 > 平衡二叉树"
    primary_target_name: "平衡二叉树（AVL）的构建、旋转、查找ASL综合"
    target_difficulty: 4
    k_radar: {K1: 2, K2: 1, K3: 4, K4: 4, K5: 2}
    k_dominant: "K4"
    difficulty_rationale: "高难度：融合AVL构建+旋转判断+查找ASL计算多个考察项，需多步状态推演+陷阱识别（哪个节点失衡、旋转方向）。"
    examination_mode: "综合型——AVL构建过程+失衡旋转判断+查找ASL计算（多考察项融合）"
    hard_constraints:
      - "给定插入序列，构建AVL树"
      - "指出每次失衡及旋转类型"
      - "计算构建完成后的查找ASL"
    teacher_annotation: "K4高难度融合题：把AVL构建、旋转判断、ASL计算三个考察项融进一道题，提高考察密度。学生需处理多步状态+识别陷阱。"

teacher_preferences:
  require: ["考察密度高", "干扰项对应真实错误", "计算过程完整"]
  avoid: ["照搬原题", "只改参数"]
  style_notes: "原创场景，参数重新设计"
