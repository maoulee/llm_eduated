  primary_target_name: 寻址方式有效地址推导（填表文字）
  target_difficulty: 3
  k_dominant: K3
  examination_mode: 综合题——给指令格式(I/X/D)，推导各寻址方式有效地址表达式（文字表格，不画图）
  题型: 简答题
