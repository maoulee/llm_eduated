  题型: 简答题
- slot_id: Q20
  question_type: comprehensive
  complexity: standard
  score: 6
  target_subject: 计算机组成原理
  target_family: 数据表示与运算 > 补码
  primary_target_name: 变形补码加减与溢出判断
  target_difficulty: 3
  k_dominant: K3
  examination_mode: 综合题——给两个小数，用变形补码算x+y和x-y并判溢出
  题型: 简答题
- slot_id: Q21
  question_type: comprehensive
  complexity: standard
  score: 6
  target_subject: 计算机组成原理
  target_family: 数据表示与运算 > 加法器
  primary_target_name: 先行进位加法器进位表达式文字推导
  target_difficulty: 4
  k_dominant: K3
  examination_mode: 综合题——写出先行进位加法器各级进位生成/传递函数与进位表达式（文字推导，不画电路图）
  hard_constraints:
  - 纯文字推导进位表达式，禁止要求画电路图/框图
  teacher_annotation: 原卷是画四位快速加法器电路填名称，已替换为先行进位各级表达式文字推导（系统无成图能力）。
  题型: 简答题
- slot_id: Q22
  question_type: comprehensive
  complexity: standard
  score: 10
  target_subject: 计算机组成原理
  target_family: 存储系统 > Cache 映射
  primary_target_name: Cache 直接相联/组相联映射地址字段位数推导
  target_difficulty: 4
  k_dominant: K3
  examination_mode: 综合题——给主存/Cache容量与块大小，推导直接相联与组相联映射下主存地址各字段位数（Tag/Set/Offset 文字列出，不画图）
  hard_constraints:
  - 纯文字推导各字段位数，禁止要求画地址划分图/框图
  teacher_annotation: 原卷是画地址划分图，已替换为文字推导位数（系统无成图能力）。
  题型: 应用题
- slot_id: Q23
  question_type: comprehensive
  complexity: standard
  score: 10
  target_subject: 计算机组成原理
  target_family: 中央处理器 > 微程序控制器
  primary_target_name: 水平型微指令格式设计与控存容量
  target_difficulty: 4
  k_dominant: K4
  examination_mode: 设计题——给微命令互斥类，设计水平型编码微指令格式（字段+位数）并算控存最大容量
  题型: 设计题
- slot_id: Q24
  question_type: comprehensive
  complexity: standard
  score: 10
  target_subject: 计算机组成原理
  target_family: 存储系统 > 存储器扩展
  primary_target_name: DRAM 芯片扩展设计（芯片数/地址分配/片选/刷新）
  target_difficulty: 4
  k_dominant: K4
  examination_mode: 设计题——用小容量 DRAM 芯片设计大容量存储器：推导芯片数量、地址分配、片选逻辑（文字描述），并算异步刷新周期
  hard_constraints:
  - 纯文字推导芯片数/地址分配/片选逻辑，禁止要求画存储器框图/连接图
  teacher_annotation: 原卷是画存储器结构及CPU连接框图，已替换为文字推导芯片数/地址分配/片选（系统无成图能力）。
  题型: 设计题
