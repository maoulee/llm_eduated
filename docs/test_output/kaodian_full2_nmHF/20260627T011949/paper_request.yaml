  question_type: comprehensive
  complexity: standard
  score: 10
  target_subject: 计算机组成原理
  target_family: 数据表示与运算 > IEEE754 / 补码
  primary_target_name: IEEE754 浮点加减运算步骤填空（对阶/规格化/舍入多空）
  target_difficulty: 3
  k_dominant: K3
  examination_mode: 填空题——给定两个 IEEE754 单精度数相加，补全对阶、尾数求和、规格化、就近偶数舍入步骤中的关键空（约8-10空，每空1分）
  hard_constraints:
  - 纯文字步骤填空，禁止要求作图
  - 结果必须是具体数值/表达式
  teacher_annotation: 填空题，gen.py 算出每步确切值，空格处填具体数。
  题型: 填空题
