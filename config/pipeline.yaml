# Pipeline configuration — routing, params, context injection
# Loaded by core_new/doc_pipeline/pipeline_config.py

# ── Pipeline parameters ──────────────────────────────────────
pipeline:
  max_analysis_iterations: 3
  max_agent_attempts: 30
  default_max_tokens: 20000
  default_thinking_budget: 10000
  python_exec_timeout: 30
  slot_concurrency: 2          # env PIPELINE_SLOT_CONCURRENCY overrides this

  features:
    enable_question_design: true  # Phase 1: generate design_card.md before question writer
    enable_pipeline_graph: true  # code-as-truth: declarative signal+edge graph is the sole path; legacy _run_standard_pipeline/_run_conceptual_pipeline kept as fallback
    enable_split_design: true   # §18 split design (exam_form→skeleton→form_gate→solve→distractor) is the default path; set false to fall back to the stable graph.

  sampling:
    temperature: 0.2
    top_p: 0.9

  # thinking_token_budget — vLLM/本地专属（仅 thinking_control_method ==
  # chat_template_kwargs 或 provider_type==local 生效；远程 API 模型被
  # LLMGateway._supports_thinking_budget 网关挡掉，拿不到此参数）。
  # §19 后 design 一个 agent 承担 P1 出题 + P2 定稿，覆盖原 skeleton_design/
  # distractor_assembly/question_sc/question_comp 的思考预算。
  thinking_budget:
    outline: 8000
    question_design: 2000
    exam_form: 2000          # §17.3 narrow judgment task (KP + K-radar → form)
    design: 6000             # §19 design P1 出题（骨架复用+经验值参数，大胆不验证）
    review: 2000             # 审核是结构判断，不需要深推理
    solve: 10000
    final_review: 4000       # 终审两项检查，不需要深推理

  # Per-role system parameters (moved from agent MD frontmatter)
  roles:
    outline:
      multi_turn: false
      max_attempts: 2
    question_design:
      multi_turn: false
      max_attempts: 1
    exam_form:
      multi_turn: false
      max_attempts: 1
    design:
      multi_turn: true       # §19 design P1 多轮（form_gate needs_fix 回退）
      max_attempts: 8        # C 方案代码先行流程需多轮（write gen.py→exec→edit→组装）
    concept_creator:
      multi_turn: true       # §21 概念题出题（审核回退需多轮）
      max_attempts: 3
    review:
      multi_turn: false
      max_attempts: 2
    solve:
      multi_turn: false
      max_attempts: 2
    final_review:
      multi_turn: false
      max_attempts: 2

# ── Routing profiles ─────────────────────────────────────────
routing:
  default_profile: all_local

  providers:
    fallback: "glm5.1"
    local: "api_vllm"
    health_check_ttl: 60

  profiles:
    all_local:
      _default: local
      model_routing: {}

    all_remote:
      _default: remote
      model_routing: {}

    mixed:
      _default: local
      doc_review: remote
      doc_fix: remote
      review: remote
      model_routing:
        review: "{fallback}"
        solve: "{fallback}"

    glm_gen_qwen_review:
      _default: remote
      doc_review: local
      doc_format: local
      review: local
      model_routing:
        design: "{fallback}"
        solve: "{fallback}"
        review: "{local}"

    qwen_gpt_core:
      _default: local
      model_routing:
        design: webgpt
        review: webgpt
        solve: webgpt
        final_review: webgpt

    hybrid:
      _default: local
      model_routing:
        paper_composer: hybrid
        design: hybrid
        solve: hybrid
        review: hybrid
        final_review: hybrid

    glm_gpt_review:
      _default: "{fallback}"
      model_routing:
        final_review: hybrid

# ── Model routing ──────────────────────────────────────────────
model_routing:
  # 交互层模型（渲染/grep/归纳）
  interaction: glm5.1
  # 自由组卷模型（路线3 Step1）
  free_compose: glm5.1

# ── Context providers ────────────────────────────────────────
context_providers:
  builtins:
    - name: assembled
      type: file
      path_pattern: "{workspace}/{slot_id}/blueprint.md"
      label: "规划"
      phases: [2, 3, 5]

    - name: question
      type: file
      path_pattern: "{workspace}/{slot_id}/question.md"
      label: "题目"
      phases: [3, 5]

    - name: question_public
      type: file
      path_pattern: "{workspace}/{slot_id}/question_public.md"
      label: "题目"
      phases: [4]

    - name: solution
      type: file
      path_pattern: "{workspace}/{slot_id}/solution.md"
      label: "求解结果"
      phases: [5]

    - name: solve_output
      type: file
      path_pattern: "{workspace}/{slot_id}/solve_output.txt"
      label: "代码输出"
      phases: [5]
      optional: true

    - name: review_comments
      type: file
      path_pattern: "{workspace}/{slot_id}/review.md"
      label: "审核意见"
      phases: [2]
      optional: true

    - name: design_card
      type: file
      path_pattern: "{workspace}/{slot_id}/design_card.md"
      label: "设计卡"
      phases: [2, 3, 5]
      optional: true

    - name: experience_doc
      type: inline
      label: "经验文档"
      phases: [1]
      optional: true

    - name: k_definitions
      type: inline
      label: "K值定义"
      phases: [1]
      optional: true

  role_bindings:
    outline: [experience_doc, k_definitions]
    question_design: [assembled]
    design: [design_card, assembled]
    question_sc: [design_card, assembled, review_comments]
    question_comp: [design_card, assembled, review_comments]
    review: [design_card, question]
    review2: [question, solution]
    solve: [question]
    final_review: [question, solution]
