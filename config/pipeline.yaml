# Pipeline configuration — routing, params, context injection
# Loaded by core_new/doc_pipeline/pipeline_config.py

# ── Pipeline parameters ──────────────────────────────────────
pipeline:
  max_analysis_iterations: 3
  max_agent_attempts: 30
  default_max_tokens: 20000
  default_thinking_budget: 10000
  python_exec_timeout: 30
  slot_concurrency: 2          # env PIPELINE_SLOT_CONCURRENCY overrides this

  features:
    enable_question_design: true  # Phase 1: generate design_card.md before question writer
    enable_pipeline_graph: true  # code-as-truth: declarative signal+edge graph is the sole path; legacy _run_standard_pipeline/_run_conceptual_pipeline kept as fallback
    enable_split_design: true   # §18 split design (exam_form→skeleton→form_gate→solve→distractor) is the default path; set false to fall back to the stable graph.
    enable_team_pipeline: false # team_pipeline 四角色常驻团队路径（design_direct→write_gen→write_solution→dual_review），A/B 测试用；true 时 graph 走 build_team_pipeline_graph

  sampling:
    temperature: 0.2
    top_p: 0.9

  # thinking_token_budget — vLLM 引擎层思考预算（需 serve 时带 --reasoning-parser
  # + --reasoning-config）。reasoning parser 数 token，到 budget 强制注入
  # reasoning_end_str 截断思考块。这是 Qwen3.6 真正的思考深度旋钮（enable_thinking
  # 只是开/关）。分档：简单任务~2000（浅思考辅助归纳+防无界循环），
  # 出题设计 8000-12000（保推理质量）。
  thinking_budget:
    interact: 2000           # 交互层：浅思考辅助读卷/检索归纳，低 budget 截断防循环
    outline: 8000            # 组卷规划，需结构化推理
    question_design: 2000    # 骨架从经验复用，窄判断
    exam_form: 2000          # KP+K-radar→形式，窄判断
    design: 10000            # 出题创造性任务，需深推理
    concept_creator: 2000    # 概念题基于知识回忆
    review: 2000             # 结构审核/判断
    solve: 12000             # 求解需推演算法
    final_review: 2000       # 终审一致性检查

  # Per-role system parameters (moved from agent MD frontmatter)
  # enable_thinking: 思考开关。配合 thinking_token_budget 控制：开思考 + 低 budget
  #   （~2000）= 浅思考辅助归纳 + budget 截断防无界循环；高 budget（8000-12000）
  #   = 保推理质量。Qwen3.6 的 thinking_token_budget 是 vLLM 引擎层有效控制
  #   （reasoning parser 数 token 到 budget 强制截断）。
  # max_tokens: per-role 生成上限。缺省=用 default_max_tokens。
  roles:
    outline:
      multi_turn: false
      max_attempts: 2
      enable_thinking: true    # 组卷规划，需思考
      max_tokens: 12000
    question_design:
      multi_turn: false
      max_attempts: 1
      enable_thinking: true    # 开思考+低budget：骨架复用，浅思考辅助
      max_tokens: 4000
    exam_form:
      multi_turn: false
      max_attempts: 1
      enable_thinking: true    # 开思考+低budget：KP+K-radar→形式，浅思考辅助
      max_tokens: 2000
    design:
      multi_turn: true       # §19 design P1 多轮（form_gate needs_fix 回退）
      max_attempts: 8        # C 方案代码先行流程需多轮（write gen.py→exec→edit→组装）
      enable_thinking: true    # 出题是创造性任务，需思考
      reasoning_effort: high   # glm5.2 深度推理（出题创造性任务）
      max_tokens: 16000
    concept_creator:
      multi_turn: true       # §21 概念题出题（审核回退需多轮）
      max_attempts: 3
      enable_thinking: true    # 开思考+低budget：概念题基于知识回忆，浅思考辅助
      max_tokens: 6000
    review:
      multi_turn: false
      max_attempts: 2
      enable_thinking: true    # 开思考+低budget：结构审核/判断，浅思考辅助
      reasoning_effort: low    # glm5.2 轻量审核（对照判据，不需深推）
      max_tokens: 4000
    solve:
      multi_turn: false
      max_attempts: 2
      enable_thinking: true    # 求解需推演算法，开思考
      reasoning_effort: high   # glm5.2 深度推理（算法求解）
      max_tokens: 20000
    final_review:
      multi_turn: false
      max_attempts: 2
      enable_thinking: true    # 开思考+低budget：一致性检查，浅思考辅助
      max_tokens: 6000
    # ── team_pipeline 四角色（enable_team_pipeline 开启时由 build_team_pipeline_graph 使用）──
    design_direct:             # 题干锚定（一步直出 question.md）
      multi_turn: true
      max_attempts: 4
      enable_thinking: true    # 出题是创造性任务，需思考
      reasoning_effort: high   # glm5.2 深度推理（出题创造性任务）
      max_tokens: 16000
    write_gen:                 # 建模码（写 gen.py + exec 验证）
      multi_turn: true         # dual_review needs_fix 回退需多轮（write/edit/exec）
      max_attempts: 8
      enable_thinking: true
      reasoning_effort: high   # glm5.2 深度推理（建模+exec）
      max_tokens: 12000
    write_solution:            # 文档转写（gen.py → solution.md）
      multi_turn: true
      max_attempts: 4
      enable_thinking: true
      reasoning_effort: low    # glm5.2 轻量（忠实转写，不需深推）
      max_tokens: 8000
    dual_review:               # 双阶段审核（A 代码 / B 文档）
      multi_turn: true
      max_attempts: 3
      enable_thinking: true    # 审核需对照判据，开思考
      reasoning_effort: high   # glm5.2 深度审核（对照判据+证据）
      max_tokens: 16000
    interact:                  # 交互层：读卷/检索/呈现/组yaml，窄判断+工具调用
      enable_thinking: true    # 开思考但低 budget（~2000）：浅思考辅助归纳，budget 截断防无界循环
      # max_tokens 不在此设：scheduler 按 scenario 取（Entry D=16000, 其余=8192）

# ── Routing profiles ─────────────────────────────────────────
routing:
  default_profile: all_local

  providers:
    fallback: "glm5.1"
    local: "api_vllm"
    health_check_ttl: 60

  profiles:
    all_local:
      _default: local
      model_routing: {}

    all_remote:
      _default: remote
      model_routing: {}

    mixed:
      _default: local
      doc_review: remote
      doc_fix: remote
      review: remote
      model_routing:
        review: "{fallback}"
        solve: "{fallback}"

    glm_gen_qwen_review:
      _default: remote
      doc_review: local
      doc_format: local
      review: local
      model_routing:
        design: "{fallback}"
        solve: "{fallback}"
        review: "{local}"

    qwen_gpt_core:
      _default: local
      model_routing:
        design: webgpt
        review: webgpt
        solve: webgpt
        final_review: webgpt

    hybrid:
      _default: local
      model_routing:
        paper_composer: hybrid
        design: hybrid
        solve: hybrid
        review: hybrid
        final_review: hybrid

    glm_gpt_review:
      _default: "{fallback}"
      model_routing:
        final_review: hybrid

# ── Model routing ──────────────────────────────────────────────
model_routing:
  # 交互层模型（渲染/grep/归纳）
  interaction: glm5.1
  # 自由组卷模型（路线3 Step1）
  free_compose: glm5.1

# ── Context providers ────────────────────────────────────────
context_providers:
  builtins:
    - name: assembled
      type: file
      path_pattern: "{workspace}/{slot_id}/blueprint.md"
      label: "规划"
      phases: [2, 3, 5]

    - name: question
      type: file
      path_pattern: "{workspace}/{slot_id}/question.md"
      label: "题目"
      phases: [3, 5]

    - name: question_public
      type: file
      path_pattern: "{workspace}/{slot_id}/question_public.md"
      label: "题目"
      phases: [4]

    - name: solution
      type: file
      path_pattern: "{workspace}/{slot_id}/solution.md"
      label: "求解结果"
      phases: [5]

    - name: solve_output
      type: file
      path_pattern: "{workspace}/{slot_id}/solve_output.txt"
      label: "代码输出"
      phases: [5]
      optional: true

    - name: review_comments
      type: file
      path_pattern: "{workspace}/{slot_id}/review.md"
      label: "审核意见"
      phases: [2]
      optional: true

    - name: design_card
      type: file
      path_pattern: "{workspace}/{slot_id}/design_card.md"
      label: "设计卡"
      phases: [2, 3, 5]
      optional: true

    - name: experience_doc
      type: inline
      label: "经验文档"
      phases: [1]
      optional: true

    - name: k_definitions
      type: inline
      label: "K值定义"
      phases: [1]
      optional: true

  role_bindings:
    outline: [experience_doc, k_definitions]
    question_design: [assembled]
    design: [design_card, assembled]
    question_sc: [design_card, assembled, review_comments]
    question_comp: [design_card, assembled, review_comments]
    review: [design_card, question]
    review2: [question, solution]
    solve: [question]
    final_review: [question, solution]
    # ── team_pipeline 四角色 ──
    design_direct: [design_card, assembled]
    write_gen: [question, design_card]
    write_solution: [gen, question]
    dual_review: [question, solution, gen]
