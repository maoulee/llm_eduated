[project]
name = "mcts-reason"
version = "0.1.0"
description = "408 adaptive exam system: extraction, solve, generation"
requires-python = ">=3.12"

# ── Core (always needed) ──────────────────────────────────
dependencies = [
    "openai>=2.0",
    "anthropic>=0.90",
    "httpx[socks]>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
    "rich>=13.0",
    "tqdm>=4.60",
    "networkx>=3.0",
]

# ── Optional groups ──────────────────────────────────────
[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "faiss-cpu>=1.7",
    "scikit-learn>=1.5",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
vllm = [
    "vllm>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["core_new", "llm_providers_new", "config.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
